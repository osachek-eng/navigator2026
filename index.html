<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навигатор 2026 | Полный контроль</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .card { background: white; border-radius: 1.5rem; border: 1px solid #e2e8f0; transition: 0.3s; height: 100%; display: flex; flex-direction: column; }
        .card:hover { border-color: #3b82f6; box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.2); }
        .tag-sport { background: #fff7ed; color: #c2410c; border: 1px solid #fdba74; font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 700; transition: 0.2s; }
        .tag-sport:hover { background: #ffedd5; transform: scale(1.05); }
        .date-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.875rem; }
        .cell-link { transition: 0.2s; display: block; width: 100%; height: 100%; }
        .cell-link:hover { color: #2563eb; background: #eff6ff; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-900 pb-20">

    <header class="bg-white/80 backdrop-blur-md border-b sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 font-black text-xl tracking-tighter">
                <span class="text-blue-600">NAVIGATOR</span><span>2026</span>
            </div>
            <div id="timer" class="text-xs font-bold bg-slate-900 text-white px-4 py-2 rounded-full">
                До приема: <span id="days-count" class="text-blue-400">--</span> дн.
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 mt-8">
        
        <!-- Timeline Section -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-12">
            <!-- ЕГЭ -->
            <div class="bg-white p-6 rounded-3xl border border-slate-200">
                <h2 class="text-sm font-black mb-4 uppercase text-slate-400 tracking-widest">Экзамены</h2>
                <div class="space-y-1">
                    <div class="date-row"><span>Русский язык</span><span class="font-bold">4 июня</span></div>
                    <div class="date-row"><span>Математика</span><span class="font-bold">8 июня</span></div>
                    <div class="date-row text-blue-600"><span>Физика</span><span class="font-bold">11 июня</span></div>
                </div>
            </div>

            <!-- Бюджет -->
            <div class="bg-white p-6 rounded-3xl border border-slate-200">
                <h2 class="text-sm font-black mb-4 uppercase text-green-600 tracking-widest">Бюджет</h2>
                <div class="space-y-1">
                    <div class="date-row"><span>Старт приема</span><span class="font-bold">20 июня</span></div>
                    <div class="date-row"><span>Списки</span><span class="font-bold">27 июля</span></div>
                    <div class="date-row font-bold text-red-600"><span>Оригинал до</span><span>3 авг 12:00</span></div>
                </div>
            </div>

            <!-- Платное -->
            <div class="bg-slate-900 text-white p-6 rounded-3xl shadow-xl shadow-blue-100">
                <h2 class="text-sm font-black mb-4 uppercase text-blue-400 tracking-widest">Платное (Контракт)</h2>
                <div class="space-y-1">
                    <div class="date-row border-slate-800"><span>Заключение договоров</span><span class="font-bold text-white">до 15 августа</span></div>
                    <div class="date-row border-slate-800"><span>Оплата 1 семестра</span><span class="font-bold text-white">до 20 августа</span></div>
                    <div class="date-row border-slate-800 text-blue-400"><span>Приказы (платно)</span><span class="font-bold">до 28 августа</span></div>
                </div>
            </div>
        </section>

        <!-- Universities Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8" id="uni-list"></div>
    </main>

    <script>
        const unis = [
            {
                name: "РГУ нефти и газа им. Губкина",
                sport: "МС: +10 б. / КМС: +5 б.",
                link: "https://www.gubkin.ru/info/enrollee/admission_board/",
                specs: [
                    { name: "ИБ автоматиз. систем (С)", budget: 32, paid: 15, score: 265, price: "310.000" },
                    { name: "Информ. безопасность (Б)", budget: 28, paid: 50, score: 268, price: "305.000" }
                ]
            },
            {
                name: "НИТУ МИСИС",
                sport: "Только ГТО (3 б.)",
                link: "https://misis.ru/applicants/admission/",
                specs: [
                    { name: "Информ. безопасность (Б)", budget: 45, paid: 60, score: 272, price: "310.000" },
                    { name: "Компьютерная безопасность (С)", budget: 25, paid: 30, score: 268, price: "315.000" }
                ]
            },
            {
                name: "РУТ (МИИТ)",
                sport: "МС / Сборная: +5 б.",
                link: "https://www.miit.ru/admission",
                specs: [
                    { name: "Информ. безопасность (Б)", budget: 40, paid: 150, score: 245, price: "285.000" },
                    { name: "ИБ автоматиз. систем (С)", budget: 35, paid: 300, score: 240, price: "290.000" }
                ]
            },
            {
                name: "МИИГАиК",
                sport: "МС / Сборная: +6 б.",
                link: "https://www.miigaik.ru/priem/",
                specs: [
                    { name: "Информ. безопасность (Б)", budget: 20, paid: 25, score: 235, price: "250.000" },
                    { name: "Прикладная геодезия (С)", budget: 110, paid: 40, score: 215, price: "260.000" }
                ]
            },
            {
                name: "РАНХиГС (Москва)",
                sport: "МС: +5 б.",
                link: "https://www.ranepa.ru/pk/",
                specs: [
                    { name: "Системный анализ и упр. (Б)", budget: 60, paid: 30, score: 255, price: "350.000" }
                ]
            },
            {
                name: "МФЮА",
                sport: "МС: +5 б.",
                link: "https://priem.mfua.ru/",
                specs: [
                    { name: "Информ. безопасность (Б)", budget: 10, paid: 45, score: 195, price: "185.000" }
                ]
            }
        ];

        function init() {
            // Timer
            const start = new Date('2026-06-20');
            const diff = start - new Date();
            document.getElementById('days-count').innerText = Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));

            const list = document.getElementById('uni-list');
            list.innerHTML = unis.map(u => `
                <div class="card p-8">
                    <div class="flex justify-between items-start mb-6 gap-4">
                        <h3 class="font-black text-xl leading-tight">${u.name}</h3>
                        <a href="${u.link}" target="_blank" class="tag-sport whitespace-nowrap">
                            <i class="fas fa-trophy mr-1"></i> ${u.sport}
                        </a>
                    </div>
                    
                    <div class="flex-grow">
                        <div class="grid grid-cols-4 text-[10px] font-black text-slate-400 uppercase mb-2 px-2">
                            <div>Направление</div>
                            <div class="text-center">Бюдж.</div>
                            <div class="text-center">Плат.</div>
                            <div class="text-right">Цена</div>
                        </div>
                        <div class="space-y-1">
                            ${u.specs.map(s => `
                                <div class="grid grid-cols-4 items-center bg-slate-50 rounded-xl border border-slate-100 text-sm overflow-hidden">
                                    <a href="${u.link}" target="_blank" class="p-3 font-bold text-slate-700 leading-tight cell-link">${s.name}</a>
                                    <a href="${u.link}" target="_blank" class="p-3 text-center font-black text-green-600 cell-link">${s.budget}</a>
                                    <a href="${u.link}" target="_blank" class="p-3 text-center font-bold text-slate-400 cell-link">${s.paid}</a>
                                    <a href="${u.link}" target="_blank" class="p-3 text-right font-black text-blue-600 cell-link">${s.price}</a>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                        <p class="text-[10px] text-slate-400 uppercase font-bold mb-3 tracking-widest">Проверка данных на официальном сайте</p>
                        <a href="${u.link}" target="_blank" class="flex items-center justify-center gap-2 w-full py-4 bg-slate-900 text-white rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-blue-600 transition-colors">
                            Перейти в приемную комиссию <i class="fas fa-external-link-alt text-[10px]"></i>
                        </a>
                    </div>
                </div>
            `).join('');
        }
        window.onload = init;
    </script>
</body>
</html>
