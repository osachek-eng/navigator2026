<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навигатор ИБ 2026 | Официальные данные</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background-color: #f1f5f9; }
        .uni-card { background: white; border-radius: 1.2rem; border: 1px solid #e2e8f0; transition: 0.3s; }
        .uni-card:hover { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .tag-sport { background: #fff7ed; color: #c2410c; border: 1px solid #fdba74; font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 700; }
        .table-head { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 800; }
    </style>
</head>
<body>

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white"><i class="fas fa-university"></i></div>
                <h1 class="text-xl font-extrabold text-slate-800">Абитуриент 2026</h1>
            </div>
            <div id="timer" class="bg-slate-900 text-white px-5 py-2 rounded-full text-sm font-bold">
                До начала приема: <span id="days-count" class="text-blue-400">--</span> дней
            </div>
        </div>
    </header>

    <section class="container mx-auto px-4 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
            <div class="bg-blue-50 p-6 rounded-2xl border border-blue-100">
                <h2 class="font-bold text-blue-900 mb-4"><i class="fas fa-edit mr-2"></i> График ЕГЭ 2026 (Официально)</h2>
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between border-b border-blue-100 pb-1"><span>Русский язык</span><span class="font-bold">4 июня</span></div>
                    <div class="flex justify-between border-b border-blue-100 pb-1"><span>Математика (профиль)</span><span class="font-bold">8 июня</span></div>
                    <div class="flex justify-between"><span>Физика</span><span class="font-bold text-red-600">11 июня</span></div>
                </div>
            </div>
            <div class="bg-slate-800 p-6 rounded-2xl text-white">
                <h2 class="font-bold mb-4 text-blue-300"><i class="fas fa-calendar-check mr-2"></i> Приемная кампания</h2>
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between"><span>Прием документов</span><span class="font-bold">с 20 июня</span></div>
                    <div class="flex justify-between"><span>Завершение (ЕГЭ)</span><span class="font-bold">25 июля</span></div>
                    <div class="flex justify-between"><span>Зачисление</span><span class="font-bold">5-9 августа</span></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6" id="uni-list"></div>
    </section>

    <script>
        const unis = [
            {
                name: "РГУ нефти и газа им. Губкина",
                sport: "МС: +10 б. / КМС: +5 б.",
                link: "https://www.gubkin.ru/comission/",
                specs: [
                    { name: "ИБ автоматиз. систем (С)", budget: 32, paid: 15, score: 265, price: "310.000" },
                    { name: "Информ. безопасность (Б)", budget: 28, paid: 50, score: 268, price: "305.000" }
                ]
            },
            {
                name: "НИТУ МИСИС",
                sport: null,
                link: "https://misis.ru/applicants/",
                specs: [
                    { name: "Информ. безопасность (Б)", budget: 45, paid: 60, score: 272, price: "310.000" },
                    { name: "Компьютерная безопасность (С)", budget: 25, paid: 30, score: 268, price: "315.000" }
                ]
            },
            {
                name: "РУТ (МИИТ)",
                sport: "МС / Сборная: +5 б.",
                link: "https://miit.ru/admission",
                specs: [
                    { name: "Информ. безопасность (Б)", budget: 40, paid: 150, score: 245, price: "285.000" },
                    { name: "ИБ автоматиз. систем (С)", budget: 35, paid: 300, score: 240, price: "290.000" }
                ]
            },
            {
                name: "МИИГАиК",
                sport: "МС / Сборная: +6 б.",
                link: "https://www.miigaik.ru/priem/",
                specs: [
                    { name: "Информ. безопасность (Б)", budget: 20, paid: 25, score: 235, price: "250.000" },
                    { name: "Прикладная геодезия (С)", budget: 110, paid: 40, score: 215, price: "260.000" }
                ]
            },
            {
                name: "РАНХиГС (Москва)",
                sport: "МС: +5 б.",
                link: "https://www.ranepa.ru/obr/bakalavriat-i-specialitet/",
                specs: [
                    { name: "Системный анализ и упр. (Б)", budget: 60, paid: 30, score: 255, price: "350.000" }
                ]
            },
            {
                name: "МФЮА",
                sport: "МС: +5 б.",
                link: "https://www.mfua.ru/abitur/",
                specs: [
                    { name: "Информ. безопасность (Б)", budget: 10, paid: 45, score: 195, price: "185.000" }
                ]
            }
        ];

        function calculateDays() {
            const start = new Date('2026-06-20');
            const diff = start - new Date();
            document.getElementById('days-count').innerText = Math.ceil(diff / (1000 * 60 * 60 * 24));
        }

        function init() {
            calculateDays();
            const list = document.getElementById('uni-list');
            list.innerHTML = unis.map(u => `
                <div class="uni-card p-6 flex flex-col h-full">
                    <div class="mb-4 flex justify-between items-start gap-4">
                        <h3 class="font-extrabold text-lg text-slate-800 leading-tight">${u.name}</h3>
                        ${u.sport ? `<span class="tag-sport whitespace-nowrap">${u.sport}</span>` : ''}
                    </div>
                    <div class="flex-grow overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead class="table-head">
                                <tr>
                                    <th class="py-2 text-left">Программа</th>
                                    <th class="text-center px-2">Бюдж.</th>
                                    <th class="text-center px-2">Плат.</th>
                                    <th class="text-right">Цена</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${u.specs.map(s => `
                                    <tr>
                                        <td class="py-3 font-semibold text-slate-700">${s.name}</td>
                                        <td class="text-center font-bold text-green-600">${s.budget}</td>
                                        <td class="text-center text-slate-500 font-medium">${s.paid}</td>
                                        <td class="text-right font-bold text-blue-600">${s.price}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                    <a href="${u.link}" target="_blank" class="mt-6 block text-center py-2 bg-slate-50 text-slate-500 text-xs font-bold rounded-lg hover:bg-blue-600 hover:text-white transition-colors">
                        ПЕРЕЙТИ НА САЙТ ВУЗА
                    </a>
                </div>
            `).join('');
        }
        window.onload = init;
    </script>
</body>
</html>
